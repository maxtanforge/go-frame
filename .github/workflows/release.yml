name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      notes: ${{ steps.notes.outputs.body }}
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release tag
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$tag" == "$(tr -d '\r\n' < VERSION)" ]]
          git merge-base --is-ancestor HEAD origin/main
      - name: Read changelog entry
        id: notes
        shell: bash
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## [$GITHUB_REF_NAME]" '
            /^## / { active = ($0 == heading); next }
            active { print }
          ' CHANGELOG.md > "$notes_file"
          grep -q '[^[:space:]]' "$notes_file"
          delimiter="$(cat /proc/sys/kernel/random/uuid)"
          {
            printf 'body<<%s\n' "$delimiter"
            cat "$notes_file"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify release
        run: |
          go run ./scripts/release-check --tag
          go test ./telemetry/logger -run '^TestErrorStackAllocationBudget$' -count=1
          sh scripts/verify.sh --race
      - name: Verify independent consumers
        run: go run ./scripts/consumer --repo . --mode workspace --network --race --budget 10m

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NOTES: ${{ needs.verify.outputs.notes }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' | grep -Fxq false; then
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "$RELEASE_NOTES"
